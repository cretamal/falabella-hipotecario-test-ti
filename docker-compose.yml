# Web SSR + BFF + Redis.   docker compose up --build   →   http://localhost:4000
services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      # El servidor web reenvía /api y añade X-Forwarded-For: el límite de peticiones es por visitante.
      # El BFF no se publica en el host (solo es alcanzable a través del servidor web, incluido /api/docs).
      TRUST_PROXY: '1'
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      BFF_URL: http://bff:3000
    ports:
      - '4000:4000'
    depends_on:
      bff:
        condition: service_healthy
